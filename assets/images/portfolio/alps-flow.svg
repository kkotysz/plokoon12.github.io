<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual ALPS measurement flow</title>
  <desc id="desc">Station sensors and an all-sky camera send data through transmission and a service layer into storage and public views.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f2b84b"/></marker></defs>
  <rect width="1440" height="520" fill="#0c0f11"/>
  <g stroke="#252a2e" stroke-width="1" opacity=".72"><path d="M0 130h1440M0 260h1440M0 390h1440M240 0v520M480 0v520M720 0v520M960 0v520M1200 0v520"/></g>
  <g fill="none" stroke="#f2b84b" stroke-width="3" marker-end="url(#arrow)"><path d="M250 260h155M525 260h155M800 260h155M1075 260h155"/></g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#f4f0e7">
    <g transform="translate(70 175)"><rect width="180" height="170" fill="#111519" stroke="#3c4247"/><path d="M 50 100 a 40 40 0 0 1 80 0 M 90 56 v 48 M 65 75 l 25 29 M 115 75 l -25 29" fill="none" stroke="#f2b84b" stroke-width="4"/><text x="90" y="142" text-anchor="middle" font-size="17"><tspan x="90">Sensors +</tspan><tspan x="90" dy="22">all-sky camera</tspan></text></g>
    <g transform="translate(405 175)"><rect width="120" height="170" fill="#111519" stroke="#3c4247"/><g fill="none" stroke="#f2b84b" stroke-width="4"><path d="M 28 93 a 45 45 0 0 1 64 0 M 41 80 a 27 27 0 0 1 38 0 M 54 67 a 9 9 0 0 1 12 0"/><circle cx="60" cy="99" r="5" fill="#f2b84b"/></g><text x="60" y="143" text-anchor="middle" font-size="17"><tspan x="60">Data</tspan><tspan x="60" dy="22">transmission</tspan></text></g>
    <g transform="translate(680 175)"><rect width="120" height="170" fill="#111519" stroke="#3c4247"/><path d="M28 47h64v62H28zM40 62h40M40 77h24M40 92h33" fill="none" stroke="#f2b84b" stroke-width="4"/><text x="60" y="143" text-anchor="middle" font-size="17"><tspan x="60">Service</tspan><tspan x="60" dy="22">layer</tspan></text></g>
    <g transform="translate(955 175)"><rect width="120" height="170" fill="#111519" stroke="#3c4247"/><ellipse cx="60" cy="50" rx="32" ry="13" fill="none" stroke="#f2b84b" stroke-width="4"/><path d="M28 50v52c0 8 14 14 32 14s32-6 32-14V50M28 76c0 8 14 14 32 14s32-6 32-14" fill="none" stroke="#f2b84b" stroke-width="4"/><text x="60" y="145" text-anchor="middle" font-size="17">Measurements</text></g>
    <g transform="translate(1230 175)"><rect width="140" height="170" fill="#111519" stroke="#3c4247"/><path d="M24 43h92v72H24zM70 43v72M24 78h92" fill="none" stroke="#f2b84b" stroke-width="4"/><circle cx="47" cy="61" r="7" fill="#aeb2b5"/><path d="M82 96l11-13 13 9" fill="none" stroke="#aeb2b5" stroke-width="3"/><text x="70" y="143" text-anchor="middle" font-size="17"><tspan x="70">Map, status</tspan><tspan x="70" dy="22">+ data views</tspan></text></g>
  </g>
  <text x="70" y="75" fill="#f2b84b" font-family="monospace" font-size="16" letter-spacing="3">ALPS / PUBLIC CONCEPTUAL VIEW</text>
