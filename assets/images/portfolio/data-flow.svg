    <g transform="translate(680 175)"><rect width="120" height="170" fill="#111519" stroke="#3c4247"/><path d="M25 96c10-54 22 28 34-8s20 30 36-35" fill="none" stroke="#f2b84b" stroke-width="4"/><path d="M24 112h72" stroke="#aeb2b5" stroke-width="2"/><text x="60" y="143" text-anchor="middle" font-size="17"><tspan x="60">Time-series +</tspan><tspan x="60" dy="22">Fourier analysis</tspan></text></g>
