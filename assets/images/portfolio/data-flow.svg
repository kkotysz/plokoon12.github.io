    <g transform="translate(1230 175)"><rect width="140" height="170" fill="#111519" stroke="#3c4247"/><circle cx="70" cy="76" r="34" fill="none" stroke="#f2b84b" stroke-width="4"/><path d="M70 42v68M36 76h68" stroke="#aeb2b5" stroke-width="2"/><circle cx="88" cy="60" r="6" fill="#f2b84b"/><text x="70" y="145" text-anchor="middle" font-size="17">Interpretation</text></g>
