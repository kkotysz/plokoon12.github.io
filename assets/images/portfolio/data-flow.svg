  <rect width="1440" height="520" fill="#0c0f11"/>
  <g stroke="#252a2e" stroke-width="1" opacity=".72"><path d="M0 130h1440M0 260h1440M0 390h1440M240 0v520M480 0v520M720 0v520M960 0v520M1200 0v520"/></g>
  <g fill="none" stroke="#f2b84b" stroke-width="3" marker-end="url(#arrow)"><path d="M250 260h155M525 260h155M800 260h155M1075 260h155"/></g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#f4f0e7">
