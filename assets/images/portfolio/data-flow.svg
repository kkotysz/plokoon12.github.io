<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Scientific data processing flow</title>
  <desc id="desc">Space telescope observations and spectral data move through extraction, quality control, time-series analysis, candidate selection and interpretation.</desc>
