defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      author_profile: false
    
comments:
  provider: "disqus"
  disqus:
    shortname: "krzkot"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
gallery:
  type: liquid
  path: /gallery/
theme: jekyll-theme-minimal
port: 4001
