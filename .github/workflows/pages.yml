name: Validate and deploy Pages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout Slowo Analyzer
        uses: actions/checkout@v6
        with:
          repository: kkotysz/slowo-analyzer
          path: slowo-analyzer

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            slowo-analyzer/package-lock.json

      - name: Install portfolio audit dependencies
        run: npm ci
        working-directory: site

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ../page --baseurl ""
        working-directory: site
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Slowo Analyzer dependencies
        run: npm ci
        working-directory: slowo-analyzer

      - name: Test Slowo Analyzer
        run: npm test
        working-directory: slowo-analyzer

      - name: Build Slowo Analyzer
        run: npm run build:pages
        working-directory: slowo-analyzer

      - name: Prepare Pages artifact
        run: bundle exec ruby scripts/prepare_slowo_analyzer.rb ../slowo-analyzer/dist ../page/slowo-analyzer
        working-directory: site

      - name: Validate HTML, internal links and analytics policy
        run: bundle exec ruby scripts/check_site.rb ../page
        working-directory: site

      - name: Run Axe accessibility gate
        run: |
          python3 -m http.server 4173 --directory ../page >/tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          AUDIT_BASE_URL=http://127.0.0.1:4173 npm run audit:axe
        working-directory: site

      - name: Store validated site
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: page
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download validated site
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: page

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: page

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
